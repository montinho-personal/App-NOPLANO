name: APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v4

      - name: Testes
        run: ./gradlew :app:testDebugUnitTest :app:lintDebug

      - name: Chave de assinatura (se configurada)
        env:
          CHAVE: ${{ secrets.NOPLANO_KEYSTORE_B64 }}
        run: |
          if [ -n "$CHAVE" ]; then
            echo "$CHAVE" | base64 -d > "$RUNNER_TEMP/noplano.jks"
            echo "NOPLANO_KEYSTORE=$RUNNER_TEMP/noplano.jks" >> "$GITHUB_ENV"
          fi

      - name: Gerar APK
        env:
          VERSION_CODE: ${{ github.run_number }}
          NOPLANO_KEYSTORE_PASSWORD: ${{ secrets.NOPLANO_KEYSTORE_PASSWORD }}
        run: |
          ./gradlew :app:assembleRelease
          cp app/build/outputs/apk/release/app-release.apk no-plano.apk

      - uses: actions/upload-artifact@v4
        with:
          name: no-plano-apk
          path: no-plano.apk

      # Só publica quando a chave fixa existe; sem ela, o APK não instalaria por cima do anterior.
      - name: Publicar versão
        if: env.NOPLANO_KEYSTORE != ''
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v0.1.${{ github.run_number }}" no-plano.apk \
            --title "No Plano 0.1.${{ github.run_number }}" \
            --notes "APK gerado automaticamente a partir do commit ${{ github.sha }}."
